[package]
name = "rotomdex-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bitflags.workspace = true
colorgrad = { version = "0.8.0", default-features = false }
csscolorparser = { version = "0.8.4", default-features = false }
embassy-time = "0.5.1"
futures = { version = "0.3.34", default-features = false, features = ["alloc"] }
itertools = { version = "0.15.0", default-features = false, features = ["use_alloc"] }
konst = { version = "0.4.3", default-features = false, features = ["iter"] }
libm = "0.2.16"
lru = "0.18.4"
minipng = { version = "1.0.0", features = ["adler"] }
rapidhash.workspace = true
ratatui.workspace = true
relative-path.workspace = true
rotomdex-api.workspace = true
rotomdex-chafa.workspace = true
rotomdex-gif.workspace = true
serde.workspace = true
snafu.workspace = true
strum = { version = "0.28.0", default-features = false, features = ["derive"] }
tracing = { version = "0.1.44", default-features = false, features = [] }
tui-big-text = "0.8.8"

[features]
std = ["embassy-time/std", "rotomdex-api/std"]
