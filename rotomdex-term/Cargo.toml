[package]
name = "rotomdex-term"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
etcetera = "0.11.0"
git2 = { version = "0.21.0", features = ["https"] }
indicatif = "0.18.4"
ratatui = "0.30.2"
rotomdex-core = { path = "../rotomdex-core" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tokio-stream = "0.1.19"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["chrono", "env-filter", "tracing-log"] }
tracing = "0.1.44"
