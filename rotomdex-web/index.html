<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#121212" />
        <link data-trunk rel="copy-dir" href="assets" />
        <link
            rel="preload"
            href="./assets/fonts/CascadiaCodeNF.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"/>
        <title>Ratzilla</title>
        <style>
            @font-face {
                font-family: "Cascadia Code NF";
                src: url("./assets/fonts/CascadiaCodeNF.woff2") format("woff2");
                font-style: normal;
                font-weight: 200 700;
                font-display: block;
            }

            :root {
                color-scheme: dark;
            }

            body {
                margin: 0;
                width: 100%;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                align-content: center;
                background-color: #121212;
            }
            pre {
                font-family: "Cascadia Code NF", monospace;
                font-size: 16px;
                margin: 0px;
            }

            #grid:focus,
            #grid:focus-visible {
                outline: none;
            }
        </style>
    </head>
    <body></body>
</html>
