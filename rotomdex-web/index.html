<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#121212" />
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/firacode/6.2.0/fira_code.min.css"
        />
        <link
            data-trunk
            rel="icon"
            type="image/svg+xml"
            href="assets/favicon.svg"
        />
        <link data-trunk rel="rust" data-wasm-opt="z" data-wasm-opt-params="--enable-bulk-memory --enable-nontrapping-float-to-int"/>
        <title>Rotomdex</title>
        <style>
            :root {
                color-scheme: dark;
            }

            body {
                margin: 0;
                width: 100%;
                height: 100vh;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                align-content: center;
                background-color: #121212;
            }
            pre {
                font-family: "Fira Code", monospace;
                font-size: 16px;
                margin: 0px;
            }

            #grid:focus,
            #grid:focus-visible {
                outline: none;
            }
        </style>
    </head>
    <body></body>
</html>
